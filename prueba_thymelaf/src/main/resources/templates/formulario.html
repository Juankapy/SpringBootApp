<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4" style="max-width: 500px;">
    <h2>Alta de Producto</h2>

    <form th:object="${producto}" action="/formulario" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input th:field="*{nombre}" type="text" name="nombre" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input th:field="*{precio}" type="number" name="precio" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <input th:field="*{categoria}" name="categoria" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Enviar</button>

    </form>
</div>

</body>
</html>
